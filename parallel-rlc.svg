<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="350" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Parallel RLC Circuit</text>

  <!-- Voltage Source -->
  <circle cx="80" cy="175" r="30" fill="none" stroke="#d32f2f" stroke-width="3"/>
  <line x1="70" y1="160" x2="90" y2="160" stroke="#d32f2f" stroke-width="2"/>
  <line x1="80" y1="150" x2="80" y2="170" stroke="#d32f2f" stroke-width="2"/>
  <line x1="70" y1="190" x2="90" y2="190" stroke="#d32f2f" stroke-width="2"/>
  <text x="80" y="225" text-anchor="middle" font-size="16" fill="#333">V(t)</text>

  <!-- Left vertical wire -->
  <line x1="80" y1="145" x2="80" y2="80" stroke="#333" stroke-width="3"/>
  <line x1="80" y1="205" x2="80" y2="270" stroke="#333" stroke-width="3"/>

  <!-- Top horizontal wire -->
  <line x1="80" y1="80" x2="520" y2="80" stroke="#333" stroke-width="3"/>

  <!-- Bottom horizontal wire -->
  <line x1="80" y1="270" x2="520" y2="270" stroke="#333" stroke-width="3"/>

  <!-- Resistor branch (left) -->
  <line x1="200" y1="80" x2="200" y2="110" stroke="#333" stroke-width="2"/>
  <rect x="192" y="110" width="16" height="80" fill="#f4e4c1" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="190" x2="200" y2="270" stroke="#333" stroke-width="2"/>
  <text x="230" y="155" text-anchor="start" font-size="16" fill="#333">R</text>

  <!-- Inductor branch (middle) -->
  <line x1="330" y1="80" x2="330" y2="110" stroke="#333" stroke-width="2"/>
  <path d="M 330 110 Q 345 120 330 130 Q 345 140 330 150 Q 345 160 330 170 Q 345 180 330 190"
        fill="none" stroke="#4a90e2" stroke-width="3"/>
  <line x1="330" y1="190" x2="330" y2="270" stroke="#333" stroke-width="2"/>
  <text x="360" y="155" text-anchor="start" font-size="16" fill="#333">L</text>

  <!-- Capacitor branch (right) -->
  <line x1="460" y1="80" x2="460" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="445" y1="145" x2="475" y2="145" stroke="#e74c3c" stroke-width="4"/>
  <line x1="445" y1="155" x2="475" y2="155" stroke="#e74c3c" stroke-width="4"/>
  <line x1="460" y1="170" x2="460" y2="270" stroke="#333" stroke-width="2"/>
  <text x="490" y="155" text-anchor="start" font-size="16" fill="#333">C</text>

  <!-- Ground symbol -->
  <line x1="50" y1="290" x2="110" y2="290" stroke="#333" stroke-width="3"/>
  <line x1="60" y1="300" x2="100" y2="300" stroke="#333" stroke-width="3"/>
  <line x1="70" y1="310" x2="90" y2="310" stroke="#333" stroke-width="3"/>
  <line x1="80" y1="270" x2="80" y2="290" stroke="#333" stroke-width="3"/>

  <!-- Current arrows for each branch -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2ecc71"/>
    </marker>
  </defs>
  <line x1="200" y1="95" x2="200" y2="100" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="220" y="100" text-anchor="start" font-size="12" fill="#2ecc71">I₁</text>
  <line x1="330" y1="95" x2="330" y2="100" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="350" y="100" text-anchor="start" font-size="12" fill="#2ecc71">I₂</text>
  <line x1="460" y1="95" x2="460" y2="100" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="480" y="100" text-anchor="start" font-size="12" fill="#2ecc71">I₃</text>
</svg>
