<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLC Circuit Laplace Transform Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>RLC Circuit Laplace Transform Solver</h1>

        <!-- Top Section: Circuit Diagram and Solution Method -->
        <div class="top-section">
            <div class="circuit-diagram">
                <h3>Circuit Diagram</h3>
                <img id="seriesCircuit" src="series-rlc.svg" alt="Series RLC Circuit" style="display: block; width: 100%; max-width: 500px;">
                <img id="parallelCircuit" src="parallel-rlc.svg" alt="Parallel RLC Circuit" style="display: none; width: 100%; max-width: 500px;">
            </div>

            <div class="solution-method">
                <h3>Solution Method</h3>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="method" value="partial_fractions" checked>
                        Partial Fractions
                    </label>
                    <label>
                        <input type="radio" name="method" value="residue">
                        Residue Method
                    </label>
                    <label>
                        <input type="radio" name="method" value="convolution">
                        Convolution
                    </label>
                    <label>
                        <input type="radio" name="method" value="tables">
                        Transform Tables
                    </label>
                </div>
            </div>
        </div>

        <div class="main-content">
            <!-- Left Panel: Controls -->
            <div class="control-panel">
                <h2>Circuit Parameters</h2>

                <div class="control-group">
                    <label for="circuitType">Circuit Type:</label>
                    <select id="circuitType">
                        <option value="series">Series RLC</option>
                        <option value="parallel">Parallel RLC</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="voltage">
                        Voltage Source: <span id="voltageValue">10</span> V
                    </label>
                    <input type="range" id="voltageSlider" min="1" max="50" value="10" step="0.5">
                    <input type="number" id="voltage" value="10" step="0.1" min="0.1" max="100">
                </div>

                <div class="control-group">
                    <label for="resistance">
                        Resistance: <span id="resistanceValue">100</span> Ω
                    </label>
                    <input type="range" id="resistanceSlider" min="10" max="2000" value="100" step="10">
                    <input type="number" id="resistance" value="100" step="1" min="1" max="10000">
                </div>

                <div class="control-group">
                    <label for="inductance">
                        Inductance: <span id="inductanceValue">100</span> mH
                    </label>
                    <input type="range" id="inductanceSlider" min="1" max="500" value="100" step="1">
                    <input type="number" id="inductance" value="100" step="1" min="0.1" max="1000">
                </div>

                <div class="control-group">
                    <label for="capacitance">
                        Capacitance: <span id="capacitanceValue">10</span> μF
                    </label>
                    <input type="range" id="capacitanceSlider" min="0.1" max="100" value="10" step="0.1">
                    <input type="number" id="capacitance" value="10" step="0.1" min="0.01" max="1000">
                </div>

                <div class="pole-controls">
                    <h4>Display Options</h4>
                    <label>
                        <input type="checkbox" id="showPole1" checked>
                        <span id="pole1Label">Pole 1</span>
                    </label>
                    <label>
                        <input type="checkbox" id="showPole2" checked>
                        <span id="pole2Label">Pole 2</span>
                    </label>
                    <label>
                        <input type="checkbox" id="showTotal" checked>
                        <strong>Total Response</strong>
                    </label>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="results-panel">
                <div class="solution-display">
                    <h2>Laplace Domain Solution</h2>
                    <div id="transferFunction" class="math-display"></div>
                    <div id="poles" class="math-display"></div>
                    <div id="residues" class="math-display"></div>
                    <div id="timeDomainSolution" class="math-display"></div>
                </div>

                <div class="graph-container">
                    <h3>Time Domain Response</h3>
                    <canvas id="responseGraph" width="800" height="400"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="laplace-solver.js"></script>
    <script src="graph-plotter.js"></script>
    <script src="app.js"></script>
</body>
</html>
